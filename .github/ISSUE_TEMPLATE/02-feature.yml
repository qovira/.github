name: Feature Request
description: Suggest a new capability or an improvement to an existing one
title: "[Feature]: "
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please **search existing issues and [discussions](https://github.com/orgs/qovira/discussions)** first — the idea may already be on the table.
  - type: checkboxes
    attributes:
      label: Pre-flight
      options:
        - label: I searched the existing issues and discussions and this isn't a duplicate.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What problem does this solve? What are you trying to do that you can't today?
      placeholder: I'm always frustrated when…
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see happen? Describe the capability or change.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you've weighed, and why they fall short.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else — mockups, links, examples from other projects.
